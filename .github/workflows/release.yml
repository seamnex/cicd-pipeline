# Release por tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Publica la imagen con tags semver (0.2.0, 0.2, latest) y crea el GitHub
# Release con notas generadas y el SBOM adjunto. Pasa por las mismas
# compuertas que cualquier push: un release no tiene atajos.

name: release

on:
  push:
    tags: ['v*.*.*']

# Dos releases no se pisan: el segundo espera.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Tag coincide con package.json
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comparar versiones
        # Sin este chequeo, el tag v0.3.0 puede publicar una imagen cuyo
        # /api/v1/status dice 0.2.0 en package.json: dos fuentes de verdad
        # que no coinciden, justo en lo que se mira durante un incidente.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=${TAG} package.json=${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "::error::El tag v${TAG} no coincide con package.json (${PKG})"
            exit 1
          fi

  calidad:
    needs: version
    uses: ./.github/workflows/calidad.yml

  imagen:
    needs: calidad
    uses: ./.github/workflows/imagen.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      publicar: true

  github-release:
    name: GitHub Release
    needs: imagen
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # crear el release
    steps:
      - name: Bajar el SBOM del build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.imagen.outputs.tags }}
        run: |
          {
            echo "## Imagen"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "Escaneada con Trivy antes de publicarse. SBOM (CycloneDX) adjunto."
          } > notas.md
          gh release create "${GITHUB_REF_NAME}" sbom.cdx.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notas.md \
            --generate-notes
